name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history: benchmarks/harness/p4-manifest.json pins a reference
          # commit that validateP4Manifest() (benchmarks/harness/p4-manifest.mjs)
          # checks via `git cat-file -e`. The default shallow (depth-1) checkout
          # cannot reach it, which silently red-lined every run on this workflow.
          # Do not reintroduce a shallow default here without also revisiting
          # p4-manifest.mjs's reachability check.
          fetch-depth: 0
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: npm ci --prefix npm --engine-strict
      - run: node scripts/check-npm-audit.mjs
      - run: npm --prefix npm run verify
