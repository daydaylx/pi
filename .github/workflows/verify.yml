name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Clean checkout / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - verify
          - format:check
          - lint
          - typecheck
          - deadcode
          - test:coverage
          - test:patches
          - test:frontend-contracts
          - test:gui
          - audit:check
          - test:benchmark
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - name: Assert pinned Node and npm
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci --prefix npm --engine-strict
      - name: Prepare pinned benchmark test source (no model calls)
        if: matrix.gate == 'verify' || matrix.gate == 'test:coverage' || matrix.gate == 'test:benchmark'
        run: node scripts/setup-benchmark-tests.mjs
      - name: Canonical verification chain
        if: matrix.gate == 'verify'
        run: npm --prefix npm run verify
      - name: Run gate (failure is not suppressed)
        if: matrix.gate != 'verify'
        run: npm --prefix npm run '${{ matrix.gate }}'

  semgrep:
    name: Semgrep (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.177.0
      - name: Semgrep scan (advisory — non-blocking)
        run: semgrep scan --config p/ci --config p/security-audit --error --json --output semgrep-results.json .
      # v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
