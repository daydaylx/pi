# Separate, reproducible Medium profile for real-duel.
# It preserves the real local Pi setup but overrides only the explicit
# per-process thinking level; global settings.json remains unchanged.

kind = "manifest"
name = "pi-real"
isolate_home = false

command = [
  "pi", "--print", "--mode", "json", "--approve",
  "--provider", "openai-codex", "--model", "gpt-5.6-luna",
  "--thinking", "medium",
  "{prompt}",
]
version_command = ["pi", "--version"]

policy_headless_args = ["--print"]
policy_auto_approve_args = ["--approve"]

pass_env = []

[models]
"gpt-5.6-luna" = "gpt-5.6-luna"
