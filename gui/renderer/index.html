<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'"
    />
    <title>Pi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="status-bar">
      <div id="header-left">
        <span id="brand">Pi</span>
        <button
          id="project-label"
          type="button"
          title="Projekt öffnen"
          aria-label="Projekt öffnen"
        >
          —
        </button>
        <span id="task-sep" class="header-sep" hidden>/</span>
        <span id="task-title" class="task-title" hidden></span>
      </div>
      <div id="header-center">
        <span id="permission-label" class="chip chip-warn" hidden></span>
      </div>
      <div id="header-right">
        <span id="status-dot" class="dot idle"></span>
        <span id="status-text">Nicht verbunden</span>
        <button
          id="btn-toggle-inspector"
          class="icon-button"
          title="Inspector ein-/ausblenden (Super+I)"
          aria-label="Inspector ein-/ausblenden"
        >
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M15 4v16" />
          </svg>
        </button>
        <button
          id="btn-palette"
          class="icon-button"
          title="Command-Palette (Super+Q)"
          aria-label="Command-Palette"
        >
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <path d="M9 4l-4 16M17 4l-4 16M4 9h16M3 15h16" />
          </svg>
          <span class="sr-only">Befehle</span>
        </button>
        <button
          id="btn-new-session"
          class="ghost-button"
          title="Neue Sitzung (Super+N)"
        >
          Neu
        </button>
      </div>
    </header>

    <main id="layout">
      <nav id="side-nav" aria-label="Aufgaben">
        <div id="task-sidebar-header">
          <button
            id="btn-collapse-tasks"
            class="icon-button"
            title="Aufgabenliste ein-/ausklappen"
            aria-label="Aufgabenliste ein-/ausklappen"
            aria-expanded="true"
          >
            <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </button>
          <button
            id="btn-new-task"
            class="ghost-button"
            type="button"
            title="Neue Aufgabe"
          >
            <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span class="sidebar-text">Neue Aufgabe</span>
          </button>
        </div>
        <div
          id="task-groups"
          aria-label="Aufgaben nach Status"
          role="list"
        ></div>
        <div id="task-sidebar-footer">
          <button
            data-view="chat"
            class="nav-item active"
            title="Chat"
            aria-label="Chat"
          >
            <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
              <path
                d="M4 5.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9l-4.5 4V16H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1z"
              />
            </svg>
          </button>
          <button
            data-view="changes"
            class="nav-item"
            title="Änderungen"
            aria-label="Änderungen"
          >
            <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
              <path d="M7 3v7a3 3 0 0 0 3 3h7" />
              <circle cx="7" cy="4" r="2" />
              <circle cx="17" cy="14" r="2" />
              <path d="M17 16v5" />
              <circle cx="7" cy="19" r="2" />
              <path d="M7 10v7" />
            </svg>
          </button>
          <button
            data-view="agents"
            class="nav-item"
            title="Agenten"
            aria-label="Agenten"
          >
            <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
              <circle cx="9" cy="8" r="3" />
              <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
              <circle cx="17" cy="7" r="2.4" />
              <path d="M15.5 13.2c2.6.4 4.5 2.6 4.5 5.3" />
            </svg>
          </button>
          <button
            data-view="verify"
            class="nav-item"
            title="Verifikation"
            aria-label="Verifikation"
          >
            <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
              <path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6z" />
              <path d="M9 12.5l2 2 4-4.5" />
            </svg>
          </button>
        </div>
      </nav>

      <section id="conversation">
        <!-- Workspace Tabs Bar -->
        <nav id="workspace-tabs" aria-label="Arbeitsbereich-Tabs">
          <div id="tabs-list" role="tablist">
            <button
              id="tab-chat"
              class="workspace-tab active"
              role="tab"
              aria-selected="true"
              data-tab-id="chat"
              title="Hauptchat"
            >
              <svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true">
                <path
                  d="M4 5.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9l-4.5 4V16H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1z"
                />
              </svg>
              <span class="tab-title">Chat</span>
            </button>
          </div>
        </nav>

        <div id="workspace-content">
          <!-- Chat View -->
          <div id="chat-view">
            <section id="chat" aria-live="polite"></section>
            <div id="chat-placeholder" hidden>
              <div class="empty-state-content">
                <div class="empty-state-icon">
                  <svg
                    viewBox="0 0 24 24"
                    class="icon-large"
                    aria-hidden="true"
                  >
                    <path
                      d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2zm0 4a1 1 0 0 0-1 1v4a1 1 0 0 0 2 0V7a1 1 0 0 0-1-1zm0 8a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z"
                    />
                  </svg>
                </div>
                <h2>Was soll Pi für dich tun?</h2>
                <p>
                  Gib unten deine Aufgabe ein, oder starte mit einem
                  Slash-Befehl wie <code>/workflow</code> oder
                  <code>/permission</code>.
                </p>
                <div class="empty-state-actions">
                  <button
                    id="btn-empty-new-task"
                    class="ghost-button"
                    type="button"
                  >
                    Neue Aufgabe
                  </button>
                  <button
                    id="btn-empty-open-project"
                    class="ghost-button"
                    type="button"
                  >
                    Projekt wechseln
                  </button>
                </div>
              </div>
            </div>
            <div id="no-project" hidden>
              <div id="startscreen">
                <h1 id="startscreen-title">Pi</h1>
                <p id="startscreen-subtitle">Was möchtest du tun?</p>
                <form id="startscreen-form">
                  <textarea
                    id="startscreen-input"
                    rows="3"
                    placeholder="Beschreibe deine Aufgabe …"
                  ></textarea>
                  <button id="startscreen-start" class="primary" type="submit">
                    Start →
                  </button>
                </form>
                <button
                  id="btn-open-project"
                  class="ghost-button"
                  type="button"
                >
                  Projekt öffnen …
                </button>
                <section
                  id="startscreen-recent"
                  aria-label="Letzte Projekte"
                  hidden
                >
                  <h2>Letzte Projekte</h2>
                  <div id="startscreen-recent-list" role="list"></div>
                </section>
              </div>
            </div>
          </div>

          <!-- Subagent Run View -->
          <div id="run-view" hidden>
            <div id="run-header">
              <div id="run-header-top">
                <div id="run-identity">
                  <span id="run-status-dot" class="dot idle"></span>
                  <h2 id="run-agent-name">Investigator</h2>
                  <span id="run-status-badge" class="pill running"
                    >● Running</span
                  >
                  <span id="run-duration-label" class="run-duration">0s</span>
                </div>
                <div id="run-header-actions">
                  <button
                    id="btn-run-copy"
                    class="ghost-button"
                    title="Lauf-Zusammenfassung in Zwischenablage kopieren"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      class="btn-icon"
                      aria-hidden="true"
                    >
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                      <path
                        d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                      />
                    </svg>
                    <span>Kopieren</span>
                  </button>
                  <button
                    id="btn-run-stop"
                    class="ghost-button"
                    title="Agenten stoppen"
                    disabled
                  >
                    Stopp
                  </button>
                  <button
                    id="btn-run-close"
                    class="icon-button"
                    title="Lauf-Tab schließen"
                    aria-label="Lauf-Tab schließen"
                  >
                    <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                      <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                  </button>
                </div>
              </div>
              <div id="run-task-display" class="run-task-display"></div>
              <div id="run-meta-row" class="run-meta-row">
                <span id="run-meta-model" class="run-meta-item"></span>
                <span id="run-meta-thinking" class="run-meta-item"></span>
                <span id="run-meta-parent" class="run-meta-item"></span>
              </div>
            </div>

            <!-- Run Sub-Navigation Tabs -->
            <nav id="run-nav" aria-label="Run-Unteransichten">
              <button class="run-nav-btn active" data-subpane="output">
                Output
              </button>
              <button class="run-nav-btn" data-subpane="files">
                Dateien <span id="run-files-count" class="badge-count">0</span>
              </button>
              <button class="run-nav-btn" data-subpane="tools">
                Werkzeuge
                <span id="run-tools-count" class="badge-count">0</span>
              </button>
              <button class="run-nav-btn" data-subpane="info">Info</button>
            </nav>

            <!-- Run Sub-Panes -->
            <div id="run-panes">
              <div id="run-pane-output" class="run-pane active">
                <div id="run-filter-bar" class="run-filter-bar">
                  <span class="filter-label">Filter:</span>
                  <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                  >
                    Alle
                  </button>
                  <button type="button" class="filter-btn" data-filter="error">
                    ⚠ Nur Fehler
                  </button>
                  <button type="button" class="filter-btn" data-filter="edit">
                    ✏ Edits
                  </button>
                  <button
                    type="button"
                    class="filter-btn"
                    data-filter="command"
                  >
                    💻 Terminal
                  </button>
                  <button
                    type="button"
                    class="filter-btn"
                    data-filter="explore"
                  >
                    🔍 Suche/Read
                  </button>
                </div>
                <div id="run-timeline" class="run-timeline"></div>
                <button
                  id="btn-run-jump-latest"
                  class="ghost-button jump-latest-btn"
                  hidden
                >
                  ↓ Neue Ausgabe
                </button>
              </div>
              <div id="run-pane-files" class="run-pane" hidden>
                <div id="run-files-list" class="run-files-list"></div>
              </div>
              <div id="run-pane-tools" class="run-pane" hidden>
                <div id="run-tools-summary" class="run-tools-summary"></div>
                <div id="run-tools-list" class="run-tools-list"></div>
              </div>
              <div id="run-pane-info" class="run-pane" hidden>
                <div id="run-info-table" class="run-info-table"></div>
              </div>
            </div>

            <div id="run-footer">
              <span id="run-footer-stats" class="run-footer-stats"
                >0s · 0 Tools</span
              >
            </div>
          </div>
        </div>

        <div id="banner" hidden></div>

        <footer id="composer">
          <textarea
            id="input"
            rows="2"
            placeholder="Was soll Pi tun? (Enter sendet, Shift+Enter neue Zeile)"
          ></textarea>
          <div id="composer-toolbar">
            <div id="composer-pills">
              <button
                id="pill-workflow"
                class="pill-button"
                type="button"
                title="Workflow wechseln (Shift+Tab)"
              >
                Work
              </button>
              <button
                id="pill-model"
                class="pill-button"
                type="button"
                title="Modell wechseln (Super+M)"
              >
                Modell
              </button>
              <button
                id="pill-thinking"
                class="pill-button"
                type="button"
                title="Denktiefe wechseln (Super+D)"
              >
                Denken
              </button>
            </div>
            <div id="composer-actions">
              <button id="btn-jump-latest" class="ghost-button" hidden>
                ↓ Neueste
              </button>
              <button id="btn-stop" class="ghost-button" disabled>Stopp</button>
              <button id="btn-send" class="primary">↑ Senden</button>
            </div>
          </div>
        </footer>
      </section>

      <div
        id="inspector-resize-handle"
        role="separator"
        aria-orientation="vertical"
        aria-label="Inspector-Breite ändern"
        tabindex="0"
      ></div>

      <aside id="context-area" aria-label="Inspector" tabindex="-1">
        <div id="context-overview">
          <div class="inspector-header">
            <h2>Inspector</h2>
            <div class="inspector-header-actions">
              <button
                id="btn-refresh-context"
                class="icon-button"
                title="Inspector aktualisieren"
                aria-label="Inspector aktualisieren"
              >
                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                  <path
                    d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"
                  />
                </svg>
              </button>
              <button
                id="btn-close-inspector"
                class="icon-button"
                title="Inspector schließen"
                aria-label="Inspector schließen"
              >
                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                  <path d="M18 6L6 18M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>
          <div id="context-rows" class="skeleton">Wird geladen …</div>
        </div>
      </aside>
    </main>

    <dialog id="picker-dialog">
      <h2 id="picker-title"></h2>
      <input id="picker-filter" placeholder="Filtern …" />
      <ul id="picker-list"></ul>
      <form method="dialog">
        <button value="close">Schließen</button>
      </form>
    </dialog>

    <script src="chat/markdown.js"></script>
    <script src="chat/code-block.js"></script>
    <script src="interaction-helpers.js"></script>
    <script src="agent-runs.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
